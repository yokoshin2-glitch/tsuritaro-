<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ブリ（鰤）| つり太郎 - 釣りと食のデータベース</title>
<style>
:root {
--bg-color: #080d14;
--card-bg: #101923;
--accent-blue: #00bcd4;
--accent-orange: #ff6d00;
--text-main: #e0f2fe;
--text-sub: #94a3b8;
--border: #1e293b;
}
body {
margin: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
background-color: var(--bg-color);
color: var(--text-main);
line-height: 1.6;
}
header {
background: rgba(8, 13, 20, 0.95);
padding: 0.8rem 1.5rem;
border-bottom: 1px solid var(--border);
display: flex;
justify-content: space-between;
align-items: center;
position: sticky;
top: 0;
z-index: 100;
backdrop-filter: blur(8px);
}
.logo {
font-size: 1.3rem;
font-weight: bold;
color: var(--accent-blue);
letter-spacing: 2px;
}

/* ビルボードセクション（背景画像化） */
.billboard {
/* ★ここで buri.png を背景として読み込みます */
      background: linear-gradient(to bottom, rgba(8, 13, 20, 0.2) 0%, rgba(8, 13, 20, 0.95) 100%), url('./buri_3.png') no-repeat center center;
      background: linear-gradient(to bottom, rgba(8, 13, 20, 0.2) 0%, rgba(8, 13, 20, 0.95) 100%), url('./buri.png') no-repeat center center;
background-size: cover;
padding: 10rem 1.5rem 4rem; 
text-align: center;
border-bottom: 1px solid var(--border);
position: relative;
}
.billboard-badge {
display: inline-block;
background: var(--accent-orange);
color: #fff;
font-size: 0.85rem;
font-weight: bold;
padding: 0.3rem 1rem;
border-radius: 20px;
margin-bottom: 1rem;
letter-spacing: 1px;
box-shadow: 0 4px 10px rgba(0,0,0,0.6);
}
.billboard h1 {
font-size: 4rem;
margin: 0 0 1.5rem;
color: #ffffff;
/* 背景に負けないよう、文字に強い影と発光を設定 */
text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 188, 212, 0.8);
